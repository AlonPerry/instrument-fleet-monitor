name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          cd simulator
          pip install --no-cache-dir -r requirements.txt

      - name: Validate Kubernetes Manifests
        uses: stefanprodan/kubeconform@v1
        with:
          path: "k8s"
          strict: false
