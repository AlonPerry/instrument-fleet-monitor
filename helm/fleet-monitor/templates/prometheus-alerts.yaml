apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: monitoring
data:
  alert.rules: |
    groups:
    - name: FleetEquipmentAlerts
      rules:
      - alert: VacuumLeakDetected
        expr: vacuum_pascal >= 1.0e-4
        for: 5s
        labels:
          severity: critical
        annotations:
          summary: "Vacuum leak detected on instrument!"
          description: "The vacuum pressure has risen to critical levels (>= 1.0e-4 Pa), triggering an interlock trip."
