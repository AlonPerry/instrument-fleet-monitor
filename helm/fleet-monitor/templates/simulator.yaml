apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator-deployment
  namespace: fleet-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleet-simulator
  template:
    metadata:
      labels:
        app: fleet-simulator
    spec:
      containers:
      - name: simulator
        image: fleet-simulator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: "postgres-db"
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_DB
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-simulator-service
  namespace: fleet-system
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
  selector:
    app: fleet-simulator
