apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator-deployment
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: fleet-simulator
  template:
    metadata:
      labels:
        app: fleet-simulator
    spec:
      containers:
      - name: simulator
        image: "{{ .Values.simulator.image.repository }}:{{ .Values.simulator.image.tag }}"
        imagePullPolicy: {{ .Values.simulator.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.simulator.service.port }}
        env:
        - name: DB_HOST
          value: "postgres-db"
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgres.existingSecret }}
              key: {{ .Values.postgres.passwordKey }}
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_DB
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-simulator-service
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  ports:
  - port: {{ .Values.simulator.service.port }}
    targetPort: {{ .Values.simulator.service.port }}
    nodePort: 30080
  selector:
    app: fleet-simulator
