replicaCount: 1

simulator:
  image:
    repository: fleet-simulator
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8000

postgres:
  image:
    repository: postgres
    tag: "15-alpine"
  existingSecret: postgres-secret
  passwordKey: POSTGRES_PASSWORD
  persistence:
    size: 1Gi

prometheus:
  image:
    repository: prom/prometheus
    tag: v2.45.0

grafana:
  image:
    repository: grafana/grafana
    tag: "10.1.0"
  adminPasswordSecret: grafana-secret
  adminPasswordKey: GF_SECURITY_ADMIN_PASSWORD
