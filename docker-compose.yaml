version: '3.8'

services:
  # ----------------------------------------------------
  # Service 1: Microscope/Fleet Simulator
  # ----------------------------------------------------
  simulator:
    build: ./simulator
    container_name: instrument-simulator
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres_db
      - DB_USER=fleet_user
      - DB_PASSWORD=fleet_password
      - DB_NAME=fleet_db
    depends_on:
      postgres_db:
        condition: service_healthy

  # ----------------------------------------------------
  # Service 2: PostgreSQL Database
  # ----------------------------------------------------
  postgres_db:
    image: postgres:15-alpine
    container_name: fleet_postgres
    environment:
      POSTGRES_USER: fleet_user
      POSTGRES_PASSWORD: fleet_password
      POSTGRES_DB: fleet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_user -d fleet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Service 3: Prometheus (Metrics Collection)
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  # ----------------------------------------------------
  # Service 4: Grafana (Dashboards & Visualization)
  # ----------------------------------------------------
afrika  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data: