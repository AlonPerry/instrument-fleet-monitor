version: '3.8'

services:
  simulator:
    build: ./simulator
    container_name: instrument-simulator
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus